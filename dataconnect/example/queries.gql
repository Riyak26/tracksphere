mutation CreatePublicMovieList($name: String!, $description: String) @auth(level: PUBLIC, insecureReason: "This mutation creates a public movie list and is safe to expose to the public.") {
  movieList_insert(data: {
    name: $name,
    description: $description,
    public: true,
    userId_expr: "uuidV4()", # Dummy value since public lists don't belong to a user
    createdAt_expr: "request.time",
    updatedAt_expr: "request.time"
  })
}

query GetPublicMovieLists @auth(level: PUBLIC, insecureReason: "This query retrieves public movie lists and is safe to expose to the public.") {
  movieLists(where: {public: {eq: true}}) {
    id
    name
    description
    createdAt
    updatedAt
  }
}

mutation CreatePrivateMovieList($name: String!, $description: String) @auth(level: USER) {
  movieList_insert(data: {
    name: $name,
    description: $description,
    public: false,
    userId_expr: "auth.uid",
    createdAt_expr: "request.time",
    updatedAt_expr: "request.time"
  })
}

query GetMyPrivateMovieLists @auth(level: USER) {
  movieLists(where: {public: {eq: false}, userId: {eq_expr: "auth.uid"}}) {
    id
    name
    description
    createdAt
    updatedAt
  }
}